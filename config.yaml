audio:
  chunk_ms: 250
  device: default
  sample_rate: 16000
  vad_aggressiveness: 2
autonomous:
  enabled: true
  min_engagement: 0.4
  proactive_questions: true
  thought_cooldown: 30
camera:
  backend: dshow
  height: 720
  index: 0
  width: 1280
llm:
  enable: true
  n_ctx: 16384
  n_gpu_layers: -1
  n_threads: 8
  temperature: 0.7
  top_p: 0.95
  # Show the model's real reasoning in the dashboard thoughts panel for
  # chat/audio replies too (TTS still strips <think> blocks).
  show_thinking: true
memory:
  db_path: ./data/memory/nomous.sqlite
  enable: true
  keep_important: true
  prune_days: 30
paths:
  embed_gguf_path: modules/models/embed/bge-small-en-v1.5-f16.gguf
  # Default brain: Qwen3-VL-8B-Instruct Q4_K_M (~7 GB all-in on a 16 GB card).
  # Download from Qwen/Qwen3-VL-8B-Instruct-GGUF on Hugging Face.
  gguf_path: H:/Models/Qwen3VL-8B-Instruct-Q4_K_M.gguf
  # Vision projector for the model above (same repo, mmproj file).
  mmproj_path: H:/Models/mmproj-Qwen3VL-8B-Instruct-F16.gguf
  piper_exe: modules/piper/piper.exe
  piper_out_dir: modules/piper/piper_out
  piper_voice: modules/piper/voices/en_US-amy-medium.onnx
  vosk_model_dir: modules/models/vosk-model-small-en-us-0.15
personality:
  assertiveness: 0.6
  chattiness: 0.6
  curiosity: 0.8
  formality: 0.3
  humor: 0.5
piper:
  auto_play: true
  rate: 22050
rag:
  db_path: ./data/rag/corpus.sqlite
  enable: true
ui:
  gesture_cooldown: 3
  gesture_enabled: false
  motion_sensitivity: 30
  snapshot_debounce: 4
  tts_enabled: true
  vision_enabled: true
vision:
  enabled: true
  # Vision model family: qwen3-vl-8b (default, fits easily) or qwen3.8-27b
  # (Q3_K_XL quant only — Q4_K_M does not fit a 16 GB card).
  model: qwen3-vl-8b
  # Max vision tokens per frame; frames are downscaled to frame_width first.
  image_max_tokens: 1024
  frame_width: 640
  # Qwen thinks by default; keep it off for short scene comments.
  enable_thinking: false
  # Show the model's real reasoning in the dashboard thoughts panel.
  # Turning this on also turns thinking on for vision calls (there is no
  # reasoning to display otherwise) and reserves thinking_max_tokens of
  # output budget for it; TTS still strips <think> blocks, so Piper never
  # reads reasoning aloud. Set false to restore the old status-lines-only
  # panel (and switch thinking back off for vision).
  show_thinking: true
  thinking_max_tokens: 128
  # Rolling frame memory: the last few analyzed frames, fed back into the
  # vision prompt so the model can track change over time. Capped by item
  # count and by tokens, so it can never blow the Qwen context budget.
  frame_memory_items: 5
  frame_memory_max_tokens: 512
  temperature: 0.5
  # Seconds between vision analyses. Single source of truth: the LLM's
  # process_vision cooldown and the camera loop's analysis cooldown both
  # read this key (was split across a hardcoded 15 in llm.py, an unread
  # autonomous.vision_cooldown, and a ui.vision_cooldown fallback of 12).
  vision_cooldown: 15
  # How often to describe the room when the scene is static (finding 3).
  # 0 disables the digest.
  scene_digest_minutes: 10
  # Minimum cosine similarity between face embeddings to call two faces
  # the same person. MobileNetV3 embeddings are generic image vectors,
  # not face-specific — tune on real faces if it over- or under-matches.
  embedding_match_threshold: 0.7
  scene_change_threshold: 0.15
ws:
  host: 127.0.0.1
  port: 8765
